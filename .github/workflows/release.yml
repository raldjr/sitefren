name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release contents and prepare notes
        run: python3 scripts/release.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/sitefren-release"
      - name: Check PHP and browser code
        run: |
          php -l sitefren.php
          php tests/core.php
          php -d disable_functions=curl_init,curl_setopt_array,curl_exec,curl_getinfo,curl_close tests/installations.php
          php -d disable_functions=curl_init,curl_setopt_array,curl_exec,curl_getinfo,curl_close tests/updates.php
          php -d disable_functions=curl_init,curl_setopt_array,curl_exec,curl_getinfo,curl_close tests/update-install.php
          node tests/image-drop.cjs
          POCKET_TEST_TRANSPORT=1 python3 tests/integration.py
      - name: Check browser editing and signed upgrades
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tests/node_modules/playwright"
          POCKET_TEST_TRANSPORT=1 node tests/browser.cjs
          node tests/rich-text.cjs
          node tests/mobile-pwa.cjs
      - name: Publish the verified single-file download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            sitefren.php release/update.json release/update.sig SHA256SUMS "$RUNNER_TEMP/sitefren-release/sitefren.php.sha256" \
            --verify-tag --draft --prerelease \
            --title "Sitefren Alpha ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/sitefren-release/notes.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
  verify:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify public update discovery and signed download
        run: |
          for attempt in {1..18}; do
            if php scripts/verify-published-release.php; then
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then
              echo "Waiting for the public release feed and assets to propagate (attempt $attempt)."
              sleep 20
            fi
          done
          exit 1
